<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awesome Split View</title>
    <link rel="stylesheet" href="split-view.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="toolbar-brand">Awesome Split</div>
        <div id="toolbar-tabs" class="toolbar-tabs" aria-label="Split pages"></div>
        <form id="toolbar-form" class="toolbar-actions">
          <div class="layout-actions" role="group" aria-label="Split layout">
            <button id="layout-horizontal-button" type="button" data-layout="horizontal">Top / Bottom</button>
            <button id="layout-vertical-button" type="button" data-layout="vertical">Left / Right</button>
          </div>
          <input id="toolbar-url-input" type="text" inputmode="url" spellcheck="false" placeholder="https://example.com or youtube.com" aria-label="Add page URL to Awesome Split">
          <button id="add-url-button" type="submit">Add Page</button>
        </form>
      </header>

      <section id="split-root" class="split-root"></section>

      <div id="notice" class="notice" hidden></div>
    </main>
    <script type="module" src="split-view.js"></script>
  </body>
</html>
